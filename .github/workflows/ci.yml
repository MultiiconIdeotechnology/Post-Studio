name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: poststudio
          POSTGRES_PASSWORD: poststudio
          POSTGRES_DB: poststudio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U poststudio"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          DATABASE_URL: postgres://poststudio:poststudio@localhost:5432/poststudio
          MEDIA_DIR: ${{ runner.temp }}/media

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: post-studio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deployment to the server is added once the server is ready:
  # a job that SSHes in (or uses a GHCR pull + `docker compose up -d`) on every merge to main.
